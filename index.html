<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="counter-card">
        <h1>My Counter App</h1>
        <p class="subtitle">Keep track of your numbers</p>

        <div id="count">0</div>

        <div class="buttons">
            <button class="increase" onclick="increase()">+ Increase</button>
            <button class="decrease" onclick="decrease()">− Decrease</button>
            <button class="reset" onclick="resetCounter()">Reset</button>
        </div>
        <button class="increase-five" onclick="increaseByFive()">
            +5 Increase
        </button>

        <p id="message">Ready to count?</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
